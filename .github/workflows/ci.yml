name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --run --coverage

      - name: TypeScript check
        run: npx tsc --noEmit

  build-check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      # Pinned to the declared MSRV (src-tauri/Cargo.toml rust-version)
      # rather than `stable`, so a dependency bump that raises the real
      # minimum fails here instead of silently invalidating the documented
      # requirement.
      - name: Setup Rust (MSRV)
        uses: dtolnay/rust-toolchain@1.85.0

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          # libgbm-dev: required by xcap for screen capture
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libdbus-1-dev \
            libwayland-dev \
            libegl-dev \
            libgbm-dev \
            libxcb1-dev \
            libxrandr-dev \
            pkg-config

      - name: Install frontend dependencies
        run: npm ci

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test

      # A real bundle, not `cargo check`. The Tauri CLI verifies that the
      # npm @tauri-apps/* versions and the Rust crate versions agree on
      # major.minor and aborts if they don't — a mismatch `cargo check`
      # cannot see. Bundling is skipped since only the build needs verifying.
      - name: Tauri build
        run: npx tauri build --no-bundle
