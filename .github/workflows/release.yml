name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# One release run per tag; never cancel a release half-way through.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # Only tags shaped like vMAJOR.MINOR.PATCH[-prerelease] may release.
  validate-tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - name: Validate tag
        id: check
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::Tag '$TAG' is not a valid release tag (expected vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-prerelease, e.g. v1.1.3 or v1.2.0-beta.1)"
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: validate-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm test -- --run
      - run: npx tsc --noEmit

  build-macos:
    if: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: aarch64
          - target: x86_64-apple-darwin
            arch: x64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Setting version to $VERSION"
          # Update package.json
          jq ".version = \"$VERSION\"" package.json > tmp.json && mv tmp.json package.json
          # Update tauri.conf.json
          jq ".version = \"$VERSION\"" src-tauri/tauri.conf.json > tmp.json && mv tmp.json src-tauri/tauri.conf.json
          # Update Cargo.toml
          sed -i '' "s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Import Apple certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          echo "$APPLE_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - run: npm ci

      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npm run tauri build -- --target ${{ matrix.target }} --bundles app,dmg

      - name: Prepare artifacts
        run: |
          mkdir -p upload
          BUNDLE_DIR="src-tauri/target/${{ matrix.target }}/release/bundle"

          # Copy DMG
          cp "$BUNDLE_DIR"/dmg/*.dmg upload/ 2>/dev/null || true

          # Copy and rename tarball
          TARBALL=$(find "$BUNDLE_DIR" -name "*.app.tar.gz" -type f | grep -v ".sig" | head -1)
          if [ -f "$TARBALL" ]; then
            cp "$TARBALL" "upload/beautiFULLshot_${{ matrix.arch }}.app.tar.gz"
          fi

          # Copy and rename signature
          SIG=$(find "$BUNDLE_DIR" -name "*.app.tar.gz.sig" -type f | head -1)
          if [ -f "$SIG" ]; then
            cp "$SIG" "upload/beautiFULLshot_${{ matrix.arch }}.app.tar.gz.sig"
          fi

          ls -la upload/

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: upload/*
          retention-days: 1

  build-windows:
    if: false
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync version from tag
        shell: pwsh
        run: |
          $VERSION = "$env:GITHUB_REF_NAME" -replace '^v', ''
          Write-Host "Setting version to $VERSION"
          # Update package.json
          $pkg = Get-Content package.json | ConvertFrom-Json
          $pkg.version = $VERSION
          $pkg | ConvertTo-Json -Depth 10 | Set-Content package.json
          # Update tauri.conf.json
          $tauri = Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json
          $tauri.version = $VERSION
          $tauri | ConvertTo-Json -Depth 10 | Set-Content src-tauri/tauri.conf.json
          # Update Cargo.toml
          (Get-Content src-tauri/Cargo.toml) -replace '^version = ".*"', "version = `"$VERSION`"" | Set-Content src-tauri/Cargo.toml

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --bundles nsis,msi

      - name: Prepare artifacts
        shell: bash
        run: |
          mkdir -p upload
          BUNDLE_DIR="src-tauri/target/release/bundle"

          # Copy EXE
          cp "$BUNDLE_DIR"/nsis/*-setup.exe upload/ 2>/dev/null || true

          # Copy MSI
          cp "$BUNDLE_DIR"/msi/*.msi upload/ 2>/dev/null || true

          # Copy EXE signature (for updater)
          cp "$BUNDLE_DIR"/nsis/*-setup.exe.sig upload/ 2>/dev/null || true

          ls -la upload/

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: upload/*
          retention-days: 1

  build-linux:
    needs: [validate-tag, test]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Sync version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Setting version to $VERSION"
          # Update package.json
          jq ".version = \"$VERSION\"" package.json > tmp.json && mv tmp.json package.json
          # Update tauri.conf.json
          jq ".version = \"$VERSION\"" src-tauri/tauri.conf.json > tmp.json && mv tmp.json src-tauri/tauri.conf.json
          # Update Cargo.toml
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: |
          sudo add-apt-repository -y ppa:pipewire-debian/pipewire-upstream
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libgtk-3-bin \
            libayatana-appindicator3-dev libpipewire-0.3-dev libspa-0.2-dev \
            libdbus-1-dev libwayland-dev libegl-dev libgbm-dev libfuse2 \
            libxcb1-dev libxrandr-dev librsvg2-dev libunwind-dev \
            libgstreamer1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            patchelf pkg-config

      - run: npm ci

      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPIMAGE_EXTRACT_AND_RUN: '1'
          NO_STRIP: 'true'
        run: npm run tauri build -- --bundles deb,rpm,appimage

      - name: Prepare artifacts
        run: |
          mkdir -p upload
          BUNDLE_DIR="src-tauri/target/release/bundle"

          # Copy AppImage
          cp "$BUNDLE_DIR"/appimage/*.AppImage upload/ 2>/dev/null || true

          # Copy DEB
          cp "$BUNDLE_DIR"/deb/*.deb upload/ 2>/dev/null || true

          # Copy RPM
          cp "$BUNDLE_DIR"/rpm/*.rpm upload/ 2>/dev/null || true

          # Copy AppImage signature (for updater)
          cp "$BUNDLE_DIR"/appimage/*.AppImage.sig upload/ 2>/dev/null || true

          ls -la upload/

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: upload/*
          retention-days: 1

  release:
    needs: [validate-tag, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Create release, upload assets and publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
          IS_PRERELEASE: ${{ needs.validate-tag.outputs.prerelease }}
        run: |
          # Create as draft first so the updater endpoint (releases/latest)
          # never points at a release that is still missing assets.
          # Skip creation when re-running a failed workflow for the same tag.
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            PRERELEASE_FLAG=""
            if [ "$IS_PRERELEASE" = "true" ]; then
              PRERELEASE_FLAG="--prerelease"
            fi
            gh release create "$VERSION" \
              --title "BeautyFullShot $VERSION" \
              --generate-notes \
              --draft \
              $PRERELEASE_FLAG
          fi

          echo "=== All artifacts ==="
          find artifacts -type f | sort

          # Upload all artifacts (fail the job if any upload fails)
          while IFS= read -r file; do
            echo "Uploading: $(basename "$file")"
            gh release upload "$VERSION" "$file" --clobber
          done < <(find artifacts -type f | sort)

          # Collect signatures for latest.json
          LINUX_SIG=""

          while IFS= read -r sig; do
            filename=$(basename "$sig")
            content=$(cat "$sig")
            echo "Signature found: $filename (${#content} chars)"

            if [[ "$filename" == *".AppImage.sig" && "$filename" != *".tar.gz.sig" ]]; then
              LINUX_SIG="$content"
            fi
          done < <(find artifacts -type f -name '*.sig' | sort)

          if [ -z "$LINUX_SIG" ]; then
            echo "::error::No AppImage signature found; check TAURI_SIGNING_PRIVATE_KEY secrets"
            exit 1
          fi

          VERSION_NUM="${VERSION#v}"
          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          cat > latest.json << ENDJSON
          {
            "version": "${VERSION_NUM}",
            "notes": "See the assets to download this version.",
            "pub_date": "${PUB_DATE}",
            "platforms": {
              "linux-x86_64": {
                "signature": "${LINUX_SIG}",
                "url": "https://github.com/${GH_REPO}/releases/download/${VERSION}/beautiFULLshot_${VERSION_NUM}_amd64.AppImage"
              }
            }
          }
          ENDJSON

          sed -i 's/^          //' latest.json

          echo "=== latest.json ==="
          cat latest.json

          gh release upload "$VERSION" latest.json --clobber

          # All assets are in place: publish.
          if [ "$IS_PRERELEASE" = "true" ]; then
            gh release edit "$VERSION" --draft=false --latest=false
          else
            gh release edit "$VERSION" --draft=false --latest
          fi
