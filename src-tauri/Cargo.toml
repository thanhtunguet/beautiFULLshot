[package]
name = "beautyfullshot"
version = "1.1.6"
description = "Cross-platform screenshot beautification app"
authors = ["itsddvn"]
homepage = "https://beautifullshot.itsdd.vn"
repository = "https://github.com/itsddvn/beautiFULLshot"
edition = "2021"

[lib]
name = "beautyfullshot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.12", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-opener = "2.7"
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-notification = "2.8"
xcap = "0.8.1"
image = "0.25"
dirs = "5.0"
tauri-plugin-dialog = "2.8"
tauri-plugin-clipboard-manager = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
arboard = "3.4"
tauri-plugin-process = "2.4"
tauri-plugin-updater = "2.14"
mouse_position = "0.1.4"
zip = "2.2"
trash = "5.2"

[target.'cfg(target_os = "macos")'.dependencies]
macos-accessibility-client = "0.0.1"
core-graphics = "0.25"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = ["Win32_Graphics_Dwm"] }

